<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#526d42"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b2563f"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="#fafbf2"/>
  <text x="48" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2f3f2f">Two minds, one town</text>
  <text x="48" y="86" font-size="15" fill="#7f8a73">You deliberate. Everyone else lives their lives. The city is what happens between the two.</text>

  <!-- You -->
  <rect x="48" y="118" width="300" height="230" rx="14" fill="#ffffff" stroke="#dde3cf" stroke-width="1.5"/>
  <text x="72" y="152" font-size="12" letter-spacing="2" fill="#c9a24a" font-weight="700">YOU · THE COUNCIL</text>
  <text x="72" y="182" font-family="Georgia, serif" font-size="22" fill="#2f3f2f">Slow, deliberate</text>
  <g font-size="14.5" fill="#2f3f2f">
    <text x="72" y="216">• Rule on the docket</text>
    <text x="72" y="242">• Keep or change the Rule Book</text>
    <text x="72" y="268">• Fund, refuse, delegate</text>
    <text x="72" y="294">• Form, trust or dissolve bodies</text>
  </g>
  <text x="72" y="328" font-size="13" fill="#7f8a73" font-style="italic">You never place a single building.</text>

  <!-- Town -->
  <rect x="612" y="118" width="300" height="230" rx="14" fill="#ffffff" stroke="#dde3cf" stroke-width="1.5"/>
  <text x="636" y="152" font-size="12" letter-spacing="2" fill="#3f8a99" font-weight="700">THE TOWN · EVERYONE ELSE</text>
  <text x="636" y="182" font-family="Georgia, serif" font-size="22" fill="#2f3f2f">Fast, everyday</text>
  <g font-size="14.5" fill="#2f3f2f">
    <text x="636" y="216">• Villagers walk, work, rest</text>
    <text x="636" y="242">• Families move, build, upgrade</text>
    <text x="636" y="268">• Businesses grow or relocate</text>
    <text x="636" y="294">• Institutions draft their asks</text>
  </g>
  <text x="636" y="328" font-size="13" fill="#7f8a73" font-style="italic">A local decision model weighs it all.</text>

  <!-- Arrows -->
  <path d="M352,190 C430,160 530,160 606,190" fill="none" stroke="#526d42" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="479" y="150" text-anchor="middle" font-size="13.5" fill="#526d42">rules, coin, works</text>
  <path d="M606,280 C530,310 430,310 352,280" fill="none" stroke="#b2563f" stroke-width="2.5" marker-end="url(#ah2)"/>
  <text x="479" y="330" text-anchor="middle" font-size="13.5" fill="#b2563f">petitions, protests, proposals</text>
  <circle cx="479" cy="235" r="34" fill="#f2f3e6" stroke="#c9a24a" stroke-width="2"/>
  <text x="479" y="231" text-anchor="middle" font-size="12" fill="#2f3f2f" font-weight="700">the</text>
  <text x="479" y="247" text-anchor="middle" font-size="12" fill="#2f3f2f" font-weight="700">docket</text>

  <!-- Momentum strip -->
  <rect x="48" y="376" width="864" height="70" rx="12" fill="#f2f3e6"/>
  <text x="72" y="403" font-size="12" letter-spacing="2" fill="#7f8a73" font-weight="700">THE TOWN'S CHARACTER DRIFTS · AND REMEMBERS</text>
  <g font-size="14" fill="#2f3f2f">
    <text x="72" y="430">agrarian ⟷ industrial</text>
    <text x="282" y="430">communal ⟷ market</text>
    <text x="482" y="430">tradition ⟷ innovation</text>
    <text x="702" y="430">local ⟷ planned</text>
  </g>
</svg>
