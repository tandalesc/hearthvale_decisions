# See docs/hosting.md. Secrets belong in Wrangler or cloudflare/.dev.vars.
name = "hearthvale"
main = "worker.js"
compatibility_date = "2026-10-23"
routes = [{ pattern = "hearthvale.shishirtandale.com", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/students/*"]

[observability]
enabled = true
redact_query_string = true

[triggers]
crons = ["0 7 * * *"]

# Onboard a sending domain in Cloudflare Email Service for player sign-in mail.
# Local development simulates delivery; production uses the native binding.
[[send_email]]
name = "EMAIL"

[[durable_objects.bindings]]
name = "ACCOUNT_STATE"
class_name = "AccountState"

[[durable_objects.bindings]]
name = "LEARNING_COORDINATOR"
class_name = "LearningCoordinator"

[[durable_objects.bindings]]
name = "LEARNING_CONTAINER"
class_name = "LearningContainer"

[exports.AccountState]
type = "durable-object"
storage = "sqlite"

[exports.LearningCoordinator]
type = "durable-object"
storage = "sqlite"

[exports.LearningContainer]
type = "durable-object"
storage = "sqlite"

[[r2_buckets]]
binding = "STUDENT_ARTIFACTS"
bucket_name = "hearthvale-students"

[[containers]]
class_name = "LearningContainer"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./training/Dockerfile"
build_context = ".."

[vars]
ANTHROPIC_MODEL = "claude-haiku-5-5"
DECISIONS_TEACHER_MODEL = "d1"
PAID_NARRATIONS_MONTHLY = "120"
PAID_TEACHER_MONTHLY = "1000"
GLOBAL_NARRATIONS_MONTHLY = "10000"
GLOBAL_TEACHER_MONTHLY = "100000"
AUTH_EMAIL_DAILY_CAP = "1000"
NOVEL_DAILY_CAP = "10000"
LEARNING_DAILY_LABEL_CAP = "10000"
LEARNING_MIN_ROWS = "50"
LEARNING_MAX_REPORTS = "20000"
LEARNING_MAX_JOB_ROWS = "10000"
# Set this to the deployed HTTPS origin before enabling training dispatch.
# LEARNING_PUBLIC_ORIGIN = "https://hearthvale.example.com"
# EMAIL_FROM = "hello@example.com"
# STRIPE_PRICE_MONTH = "price_..." # USD 1.00 recurring monthly
# STRIPE_PRICE_YEAR = "price_..."  # USD 10.00 recurring yearly
