<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7ef">
    <meta name="description" content="Hearthvale: lead a small town for 150 years. The townsfolk live their lives; you make the big decisions.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hearthvale">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=JetBrains+Mono:wght@400;500&display=swap">
    <title>Hearthvale</title>
    <style>
      /* The loading screen (src/ui/loading.js). Inline so it is in the first paint,
         before any script runs. Colours are the paper and ink of src/ui/tokens.css. */
      #boot {
        --paper: #fafbf2; --paper-3: #e9ebdb; --ink: #2f3f2f; --ink-2: #5a6a55; --muted: #7f8a73;
        --line: #dde3cf; --green: #526d42; --leaf: #9bb671;
        position: fixed; inset: 0; z-index: 200;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--paper); color: var(--ink); text-align: center;
        font: 15px/1.45 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 400ms cubic-bezier(.2, .8, .2, 1);
      }
      html[data-theme="night"] #boot {
        --paper: #1f2622; --paper-3: #2e3832; --ink: #e8e9dc; --ink-2: #c3c8b6; --muted: #919a87;
        --line: #36423a; --green: #93b37a; --leaf: #6f8f55;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #boot {
          --paper: #1f2622; --paper-3: #2e3832; --ink: #e8e9dc; --ink-2: #c3c8b6; --muted: #919a87;
          --line: #36423a; --green: #93b37a; --leaf: #6f8f55;
        }
      }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot[data-mode="off"] { display: none; }
      #boot[data-mode="load"][data-entering] { animation: boot-in 220ms cubic-bezier(.2, .8, .2, 1); }
      .boot-card { display: flex; flex-direction: column; align-items: center; width: min(100%, 420px); }
      .boot-leaf { width: 44px; height: 44px; margin-bottom: 8px; }
      .boot-leaf .l { fill: var(--leaf); }
      .boot-leaf .s { stroke: var(--green); }
      .boot-eyebrow {
        margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
        visibility: hidden;
      }
      #boot[data-named="1"] .boot-eyebrow { visibility: visible; }
      .boot-name {
        margin: 0; max-width: 100%; overflow-wrap: anywhere;
        font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-weight: 600;
        font-variation-settings: 'SOFT' 100, 'opsz' 144;
        font-size: clamp(40px, 11vw, 64px); line-height: 1; letter-spacing: -0.03em;
      }
      .boot-steps { display: flex; gap: 6px; margin: 28px 0 12px; }
      .boot-steps i { width: 34px; height: 4px; border-radius: 2px; background: var(--paper-3); box-shadow: inset 0 0 0 1px var(--line); }
      .boot-steps i.done, .boot-steps i.now { background: var(--green); box-shadow: none; }
      .boot-steps i.now { animation: boot-pulse 1.4s ease-in-out infinite alternate; }
      .boot-phase { margin: 0; min-height: 1.45em; color: var(--ink-2); }
      .boot-lines {
        position: absolute; left: 16px; right: 16px; bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
        height: 3em; margin: 0 auto; max-width: 34ch;
        font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; font-variation-settings: 'opsz' 24;
        color: var(--muted);
      }
      .boot-lines span { position: absolute; inset: auto 0 0; opacity: 0; animation: boot-line 36s linear infinite; }
      #boot[data-mode="splash"] :is(.boot-steps, .boot-phase, .boot-lines) { visibility: hidden; }
      @keyframes boot-pulse { from { opacity: .35; } to { opacity: 1; } }
      @keyframes boot-in { from { opacity: 0; } }
      /* Six lines, six seconds each: in, held, out. */
      @keyframes boot-line { 0% { opacity: 0; } 2%, 15% { opacity: 1; } 17%, 100% { opacity: 0; } }
      html[data-motion="reduced"] #boot, html[data-motion="reduced"] #boot * { animation: none !important; transition: none !important; }
      html[data-motion="reduced"] .boot-lines span:first-child { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot * { animation: none !important; transition: none !important; }
        .boot-lines span:first-child { opacity: 1; }
      }
      @media (max-height: 460px) { .boot-leaf { display: none; } .boot-lines { display: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-busy="true" data-mode="load">
      <div class="boot-card">
        <svg class="boot-leaf" viewBox="0 0 64 64" aria-hidden="true"><path class="l" d="M48 13C27 9 12 25 18 42c16 13 34-1 30-29Z"/><path class="s" d="m15 51 23-25" fill="none" stroke-width="4" stroke-linecap="round"/></svg>
        <p class="boot-eyebrow" aria-hidden="true">Hearthvale</p>
        <p class="boot-name">Hearthvale</p>
        <div class="boot-steps" aria-hidden="true"><i class="now"></i><i></i><i></i><i></i><i></i></div>
        <p class="boot-phase">Unfolding the map…</p>
      </div>
      <p class="boot-lines" aria-hidden="true"></p>
    </div>
    <script>
      // Before the first paint: the player's theme and motion settings (src/ui/prefs.js),
      // whether the main menu comes first (main.js), and the loading screen's lines.
      (function () {
        var html = document.documentElement, boot = document.getElementById('boot'), p = {}, intent = null;
        try { p = JSON.parse(localStorage.getItem('hearthvale-ui')) || {}; } catch (e) { /* defaults */ }
        try { intent = JSON.parse(sessionStorage.getItem('hearthvale-boot')); } catch (e) { /* none */ }
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        var night = p.theme === 'night' || (p.theme !== 'light' && dark);
        html.dataset.theme = night ? 'night' : 'light';
        html.dataset.motion = p.motion === 'reduced' ? 'reduced' : 'full';
        if (p.textSize) html.dataset.text = p.textSize;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', night ? '#1f2622' : '#f6f7ef');
        var q = new URLSearchParams(location.search);
        if (!q.get('fixture') && ((intent && intent.kind === 'menu') || (!intent && q.get('play') !== '1'))) boot.dataset.mode = 'splash';
        if (intent && intent.kind === 'new') boot.dataset.founding = '1';
        var lines = [
          'The miller swears the river runs higher every spring.',
          'Somewhere, a goose is causing trouble.',
          'The council clerk sharpens a new quill.',
          'Smoke rises from the first chimneys.',
          'The baker is up before the sun, as always.',
          'Children race the cart down to the ford.',
        ];
        var start = Math.floor(Math.random() * lines.length), out = boot.querySelector('.boot-lines');
        for (var i = 0; i < lines.length; i++) {
          var s = document.createElement('span');
          s.textContent = lines[(start + i) % lines.length];
          s.style.animationDelay = (i * 6) + 's';
          out.appendChild(s);
        }
      })();
    </script>
    <noscript>Hearthvale needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
